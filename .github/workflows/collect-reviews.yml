name: Collect reviews

on:
  # Основной автозапуск — внешний cron-пингер (cron-job.org), который точно
  # по времени бьёт в GitHub API repository_dispatch. Встроенный GitHub
  # Actions `schedule` для этого не годится (время не гарантировано,
  # опаздывал на часы), а облачная Claude Code routine физически не может
  # дёрнуть workflow (403 на Actions:write) — обе попытки задокументированы
  # в prd.md. `repository_dispatch` не требует прав Actions:write, только
  # Contents: write на репозиторий.
  repository_dispatch:
    types: [collect-reviews-cron]
  workflow_dispatch:
    inputs:
      force_email:
        description: "Прислать письмо с вложением, даже если новых отзывов нет"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect reviews
        id: collect
        run: python collect_reviews.py

      - name: Regenerate Pages
        run: python generate_page.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add otzyvy_halyk.xlsx docs/index.html
          if git diff --cached --quiet; then
            echo "No new reviews"
          else
            git commit -m "Auto-update reviews $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Send update email (есть новые отзывы)
        if: steps.collect.outputs.new_total != '0' || github.event.inputs.force_email == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Halyk Отзывы <${{ secrets.MAIL_USERNAME }}>
          to: maksimm3@halykbank.kz,SultanIs@halykbank.kz,DANIYARZ@halykbank.kz,DaurenB@halykbank.kz,ok@halykbank.kz
          subject: "Halyk отзывы — обновление ${{ steps.collect.outputs.new_total }} новых"
          body: |
            Автосбор отзывов Halyk Kazakhstan завершён.

            Новых отзывов: ${{ steps.collect.outputs.new_total }}
            Из них негативных (≤3★): ${{ steps.collect.outputs.new_negative }}

            Полная таблица — во вложении.
          attachments: otzyvy_halyk.xlsx

      - name: Send update email (новых отзывов нет)
        if: steps.collect.outputs.new_total == '0' && github.event.inputs.force_email != 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Halyk Отзывы <${{ secrets.MAIL_USERNAME }}>
          to: maksimm3@halykbank.kz,SultanIs@halykbank.kz,DANIYARZ@halykbank.kz,DaurenB@halykbank.kz,ok@halykbank.kz
          subject: "Halyk отзывы — новых нет"
          body: "Новых отзывов за сегодня не было."
